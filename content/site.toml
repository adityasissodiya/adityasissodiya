[thesis]
title = "Multi-Stakeholder Access Control in Data Ecosystems"
author = "Aditya Sissodiya"
institution = "Luleå University of Technology"
year = "2026"
type = "Licentiate thesis"
summary = "Addresses both agreement and enforcement of access rules in multi-stakeholder data ecosystems: utility-based negotiation of a common rule set, formal verification of cloud-native access policies (shown on Kubernetes), and an outline of an offline-capable access control model for distributed ecosystems."
supervisors = "Ulf Bodin, Eric Chiquito, and Johan Kristiansson"
supervisors_note = "As listed in the thesis. The current doctoral supervisory team is not stated here."

