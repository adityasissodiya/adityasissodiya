[[publications]]
title = "Formal Verification for Preventing Misconfigured Access Policies in Kubernetes Clusters"
authors = "Aditya Sissodiya, Eric Chiquito, Ulf Bodin, and Johan Kristiansson"
venue = "IEEE Access"
details = "vol. 13, pp. 141798–141813"
year = "2025"
type = "Journal article"
summary = "Models Kubernetes RBAC and admission policies in first-order logic and uses an SMT solver to search for counter-examples to security invariants before policies reach the cluster."

