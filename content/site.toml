[[research]]
label = "Command Succession under Intermittent Connectivity: Enforcing and Reconciling Human Authority in Incident Response"
label_note = "Repository: rescue-ois."
authors = "Aditya Sissodiya, Eric Chiquito, Johan Kristiansson, and Ulf Bodin"
status_key = "preparation"
status_label = "In preparation"
status_detail = "Approximately halfway to submission."
summary = "Studies command succession in rescue-service incident response over intermittent links: who may give orders when the incident commander is cut off, how disconnected devices enforce that, and how orders given in the meantime are reconciled."
